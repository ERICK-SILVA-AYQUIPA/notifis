name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  android:
    name: Motor de pagos y app Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Pruebas unitarias
        run: ./gradlew test --stacktrace
      - name: Compilar APK de pruebas
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --stacktrace
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: pagobox-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Publicar reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-pruebas
          path: '**/build/reports/tests/'

  firmware:
    name: Firmware ESP32-S3
    runs-on: ubuntu-latest
    container: espressif/idf:v5.3.1
    steps:
      - uses: actions/checkout@v4
      - name: Pruebas del protocolo en host
        run: |
          cd firmware/test_host
          cmake -B build -S . && cmake --build build && ./build/pagobox_host_tests
      - name: Compilar firmware
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          cd firmware
          idf.py set-target esp32s3
          idf.py build
      - name: Publicar firmware
        uses: actions/upload-artifact@v4
        with:
          name: pagobox-firmware
          path: |
            firmware/build/*.bin
            firmware/build/bootloader/*.bin
            firmware/build/partition_table/*.bin
